repos:
    -   repo: https://github.com/astral-sh/ruff-pre-commit
        rev: v0.16.9
        hooks:
            -   id: ruff-check

    -   repo: https://github.com/PyCQA/flake8
        rev: 7.4.1
        hooks:
            -   id: flake8
                additional_dependencies:
                    - flake8-broken-line==1.0.0

    {% if cookiecutter.git_hosting == 'github.com' -%}
    -   repo: https://github.com/rhysd/actionlint
        rev: v1.7.12
        hooks:
            -   id: actionlint
    {% elif cookiecutter.git_hosting == 'gitlab.com' -%}
    # gitlab-ci-linter needs defined GITLAB_PRIVATE_TOKEN environment variable
    -   repo: https://gitlab.com/devopshq/gitlab-ci-linter
        rev: v1.0.6
        hooks:
            -   id: gitlab-ci-linter
                args:
                    - '--project={{ cookiecutter.git_user }}/{{ cookiecutter.project_name }}'

    {% endif -%}

exclude: |
    (?x)
    (
        ^docs/_build/
    )
